<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Console result page: cost against n</title>
<desc id="dsc">A mockup of a 640 x 480 console screen with no data: a header, a chart of cost against n with square points, a fit line and a dashed prediction outline, a table of n and cycles beside it, the fit constants and a reference check below, and a footer with legend slots and a CRC. Numbered notes on the right explain each part.</desc>
