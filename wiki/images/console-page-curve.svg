<circle cx="78" cy="350" r="10" fill="#d9534f"/><text x="78" y="354" text-anchor="middle" style="font-family:Verdana,Arial,sans-serif;font-size:12px;font-weight:700;fill:#fff">2</text>
<circle cx="630" cy="290" r="10" fill="#d9534f"/><text x="630" y="294" text-anchor="middle" style="font-family:Verdana,Arial,sans-serif;font-size:12px;font-weight:700;fill:#fff">3</text>
<circle cx="78" cy="512" r="10" fill="#d9534f"/><text x="78" y="516" text-anchor="middle" style="font-family:Verdana,Arial,sans-serif;font-size:12px;font-weight:700;fill:#fff">4</text>
<circle cx="78" cy="572" r="10" fill="#d9534f"/><text x="78" y="576" text-anchor="middle" style="font-family:Verdana,Arial,sans-serif;font-size:12px;font-weight:700;fill:#fff">5</text>
<path d="M30 660 L60 660" stroke="#5a5a5a" stroke-dasharray="6 4"/>
<text x="68" y="664" class="s">action-safe, 32 / 24 px in (90 %)</text>
<path d="M330 660 L360 660" stroke="#8a8a8a" stroke-dasharray="2 3"/>
<text x="368" y="664" class="s">title-safe, 64 / 48 px in (80 %)</text>
<text x="30" y="684" class="s"><tspan class="k">REPORTED</tspan>: the usual SD overscan margins; every word and digit sits inside title-safe.</text>
<text x="700" y="134" class="h">What each part is for</text>
<circle cx="709" cy="154" r="9" fill="#d9534f"/><text x="709" y="158" text-anchor="middle" style="font-family:Verdana,Arial,sans-serif;font-size:11px;font-weight:700;fill:#fff">1</text>
<text x="726" y="158" class="s">Header: image, page n / N, the test, the unit plotted.</text>
<circle cx="709" cy="180" r="9" fill="#d9534f"/><text x="709" y="184" text-anchor="middle" style="font-family:Verdana,Arial,sans-serif;font-size:11px;font-weight:700;fill:#fff">2</text>
<text x="726" y="184" class="s">Points as 8 x 8 squares, one a row (MEASURED slot); the</text>
<text x="726" y="201" class="s">fit as a 2 px line; the prediction as a dashed outline</text>
<text x="726" y="218" class="s">(ESTIMATE slot), never filled, so points stay visible.</text>
<text x="726" y="235" class="s">Axis ends carry numbers, not just ticks.</text>
<circle cx="709" cy="257" r="9" fill="#d9534f"/><text x="709" y="261" text-anchor="middle" style="font-family:Verdana,Arial,sans-serif;font-size:11px;font-weight:700;fill:#fff">3</text>
<text x="726" y="261" class="s">The plotted values as a table, n and cycles: the photo</text>
<text x="726" y="278" class="s">carries every exact number. 10 rows fit beside the chart;</text>
<text x="726" y="295" class="s">a longer series goes on the next page.</text>
<circle cx="709" cy="317" r="9" fill="#d9534f"/><text x="709" y="321" text-anchor="middle" style="font-family:Verdana,Arial,sans-serif;font-size:11px;font-weight:700;fill:#fff">4</text>
<text x="726" y="321" class="s">Fit constants and the row count; the reference check;</text>
<text x="726" y="338" class="s">a row whose two clocks disagree gets a ! in both places.</text>
<circle cx="709" cy="360" r="9" fill="#d9534f"/><text x="709" y="364" text-anchor="middle" style="font-family:Verdana,Arial,sans-serif;font-size:11px;font-weight:700;fill:#fff">5</text>
<text x="726" y="364" class="s">Legend slots and a CRC32 of the page&#39;s numbers.</text>
<text x="700" y="400" class="h">Rules for every page</text>
<text x="700" y="422" class="s">· Same font, margins and line widths as the bench page</text>
<text x="710" y="439" class="s">(console-page-bench).</text>
<text x="700" y="461" class="s">· Y scale picked per page from the largest value, printed at</text>
<text x="710" y="478" class="s">the top of the axis; the x scale fixed per test.</text>
<text x="700" y="500" class="s">· A line is drawn as 2 px steps between rows (no anti-</text>
<text x="710" y="517" class="s">aliasing on the framebuffer) <tspan class="k e">[ESTIMATE]</tspan>.</text>
<text x="700" y="539" class="s">· Fit computed on the console and printed; the photo of the</text>
<text x="710" y="556" class="s">table lets it be redone by hand.</text>
<text x="700" y="578" class="s">· Phone photo reads every digit at 1.5 m? <tspan class="k o">[OPEN: not tried]</tspan></text>
</svg>
