<text x="30" y="36" class="t">A console result page: cost against n, with a fit</text>
<rect x="30" y="48" width="1140" height="30" rx="4" fill="#fbf1e2" stroke="#a86a00"/>
<text x="42" y="68" class="b"><tspan class="k e">MOCKUP, NO DATA.</tspan> A layout for a page like P1 (cycles a ray against cells walked). Points, line and #### are placeholders, not results.</text>
<text x="30" y="100" class="s">Status: <tspan class="k m">MEASURED</tspan> our console · <tspan class="k f">FACT</tspan> a manual or our code · <tspan class="k e">ESTIMATE</tspan> our arithmetic or model · <tspan class="k o">OPEN</tspan> not known</text>
<text x="30" y="134" class="s">The screen at 1:1, 640 x 480; one character of the console font is 12 x 24 px.</text>
