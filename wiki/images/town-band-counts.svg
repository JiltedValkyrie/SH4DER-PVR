<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Band counts: the town under c4 rules against c4 scene</title>
<desc id="dsc">Horizontal bars of receiver band vertices at bands 1, 2 and 4 codes wide for the whole static town, the town boot view, the c4 test scene and the town movers only, with the estimated mask cost and the recommendation to bake static shadow and run c4 for movers only.</desc>
