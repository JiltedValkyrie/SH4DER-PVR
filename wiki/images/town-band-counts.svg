<text x="330" y="646" class="s">band vertices</text>
<rect x="30" y="670" width="1140" height="150" rx="6" class="mv"/>
<text x="44" y="694" class="h">The cost on top (all ESTIMATE, from the counts and c4's measured passes)</text>
<text x="44" y="720" class="b">The town is 18 to 26 times c4's scene <tspan class="k e">[ESTIMATE TOWN-051]</tspan>. Culling to the view cuts about 3.8 times, not enough <tspan class="k e">[TOWN-052]</tspan>.</text>
<text x="44" y="740" class="b">Mask pass for the boot view's static bands, 2-code: about 17 ms at 2.4 us a vertex, or 33 ms at c4's whole-pass 4.7 us; 4-code 12 to 24 ms.</text>
<text x="44" y="760" class="b">Either way over a 16.7 ms frame on its own <tspan class="k e">[ESTIMATE TOWN-053]</tspan>. Movers only, 2-code: about 1.1 to 2.2 ms at 14:00 <tspan class="k e">[ESTIMATE TOWN-054]</tspan>.</text>
<text x="44" y="780" class="b">Recommendation: bake static on static; run c4 only for the movers' shadows on the patches round them, 2-code bands <tspan class="k e">[ESTIMATE TOWN-055]</tspan>.</text>
<text x="44" y="800" class="s">Source: demo/psm/TOWN_NOTES.md (host counter run on c4's rules in compare/c4_model.h; no town code changed).</text>
</svg>
