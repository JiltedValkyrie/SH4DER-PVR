<rect x="228.0" y="500" width="16" height="14" fill="#5b8cc0"/><text x="250.0" y="512" class="b">SH-4 project</text>
<rect x="365.2" y="500" width="16" height="14" fill="#9fd0a8"/><text x="387.2" y="512" class="b">PVR map</text>
<rect x="464.4" y="500" width="16" height="14" fill="#5fae74"/><text x="486.4" y="512" class="b">PVR mask</text>
<rect x="571.1999999999999" y="500" width="16" height="14" fill="#2f7d48"/><text x="593.1999999999999" y="512" class="b">PVR screen</text>
<rect x="693.1999999999999" y="500" width="16" height="14" fill="url(#hatch)" stroke="#8a8f99"/><text x="715.1999999999999" y="512" class="b">waiting</text>
<path d="M803.1999999999999 498 L803.1999999999999 516" stroke="#d9534f" stroke-width="3"/><text x="811.1999999999999" y="512" class="b">end of frame</text>
<text x="30" y="536" class="s">Dashed: 10 ms marks. Gold: 60 Hz pictures (16.7 ms each). The parts are drawn end to end; on the console the SH-4 and</text>
<text x="30" y="552" class="s">the PVR can overlap, so the sum is an upper bound of the serial work.</text>
<text x="30" y="584" class="h">What is known, and what is not</text>
<text x="30" y="608" class="b">The frame is one of two values 10.0 ms apart, 39.9 or 49.9 ms, whatever the work: 39.9 at 676 and at 1,288 vertices <tspan class="k m">[MEASURED PVR-094]</tspan>.</text>
<text x="30" y="630" class="b">Both values are 70 us short of a multiple of 10 ms; 39.9 ms is not a whole number of 60 Hz pictures (2.39) <tspan class="k e">[ESTIMATE: arithmetic]</tspan>.</text>
<text x="30" y="652" class="b">A wait that wakes on a 10 ms clock is one guess, from three numbers <tspan class="k e">[ESTIMATE]</tspan>. The cause <tspan class="k o">[OPEN PVR-094, Q53]</tspan>.</text>
<text x="30" y="674" class="b"><tspan font-weight="700">Test that would settle it:</tspan> count the pictures (vblanks) in each frame and time each wait apart, on the console.</text>
</svg>
