<text x="30" y="1004" class="h">What is known, and what is not</text>
<text x="30" y="1028" class="b">The frame is one of a few values 10 ms apart: c4 39.9 / 49.9, c4b 29.9 / 39.9 (and 49.9 in its live view, 3,008 vertices) <tspan class="k m">[MEASURED PVR-094, c4b]</tspan>.</text>
<text x="30" y="1050" class="b">The time is in the render-done waits: 36.2 of 39.2 ms. The ready waits (open, close) take 1 to 40 µs <tspan class="k m">[MEASURED c4b]</tspan>.</text>
<text x="30" y="1072" class="b">Polling the ready waits changed nothing: both runs sleep in the render-done wait <tspan class="k m">[MEASURED c4b]</tspan>.</text>
<text x="30" y="1094" class="b">A wait that wakes on a 10 ms clock fits better than before <tspan class="k e">[INFERENCE]</tspan>. The cause <tspan class="k o">[OPEN Q53, P10]</tspan>.</text>
<text x="30" y="1116" class="b"><tspan font-weight="700">Next test:</tspan> time a render done polled on render_busy in place of pvr_wait_render_done.</text>
