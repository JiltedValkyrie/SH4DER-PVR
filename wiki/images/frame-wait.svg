<text x="1099.8" y="305" class="h2" text-anchor="end" fill="#d9534f">frame 49.9 ms</text>
<text x="30" y="374" class="h2">sun 182° / 26°, bands 4 wide</text>
<text x="30" y="392" class="s">676 vertices</text>
<text x="30" y="410" class="b"><tspan class="k m">[MEASURED PVR-101]</tspan></text>
<rect x="280.0" y="360" width="13.4" height="28" fill="#8fb3d9" stroke="#fff" stroke-width="0.8"/>
<rect x="293.4" y="360" width="7.0" height="28" fill="#5b8cc0" stroke="#fff" stroke-width="0.8"/>
<rect x="300.3" y="360" width="54.5" height="28" fill="#9fd0a8" stroke="#fff" stroke-width="0.8"/>
<rect x="354.8" y="360" width="79.1" height="28" fill="#5fae74" stroke="#fff" stroke-width="0.8"/>
<rect x="433.9" y="360" width="164.2" height="28" fill="#2f7d48" stroke="#fff" stroke-width="0.8"/>
