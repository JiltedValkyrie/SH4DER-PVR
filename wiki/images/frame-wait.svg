<text x="280" y="200" class="b">work 21.7 ms <tspan class="k e">[ESTIMATE: the sum]</tspan></text>
<text x="934.9" y="200" class="h2" text-anchor="end" fill="#d9534f">frame 39.9 ms</text>
<text x="30" y="269" class="h2">sun 91° / 34°, bands 1 wide</text>
<text x="30" y="287" class="s">2,192 vertices</text>
<text x="30" y="305" class="b"><tspan class="k m">[MEASURED PVR-091]</tspan></text>
<rect x="280.0" y="255" width="37.5" height="28" fill="#8fb3d9" stroke="#fff" stroke-width="0.8"/>
<rect x="317.5" y="255" width="24.1" height="28" fill="#5b8cc0" stroke="#fff" stroke-width="0.8"/>
<rect x="341.6" y="255" width="53.4" height="28" fill="#9fd0a8" stroke="#fff" stroke-width="0.8"/>
<rect x="395.0" y="255" width="167.8" height="28" fill="#5fae74" stroke="#fff" stroke-width="0.8"/>
<rect x="562.8" y="255" width="164.1" height="28" fill="#2f7d48" stroke="#fff" stroke-width="0.8"/>
<rect x="726.9" y="255" width="376.9" height="28" fill="url(#hatch)" stroke="#8a8f99"/>
<path d="M1103.8 249 L1103.8 289" stroke="#d9534f" stroke-width="3"/>
