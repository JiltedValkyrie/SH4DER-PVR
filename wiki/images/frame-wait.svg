<text x="30" y="36" class="t">The frame waits: c4's frame time against the work measured in it</text>
<text x="30" y="58" class="s">Live view of spike c4, one console, 2026-11-25. Work = the SH-4 lines plus the three PVR passes, as the page printed them.</text>
<text x="30" y="76" class="s">Status: <tspan class="k m">MEASURED</tspan> our console · <tspan class="k f">FACT</tspan> a manual or our code · <tspan class="k e">ESTIMATE</tspan> our arithmetic or model · <tspan class="k o">OPEN</tspan> not known</text>
<path d="M280.0 110 L280.0 460" stroke="#9aa3b2" stroke-dasharray="4 4"/>
<text x="280.0" y="104" class="k" text-anchor="middle">0 ms</text>
<path d="M445.0 110 L445.0 460" stroke="#9aa3b2" stroke-dasharray="4 4"/>
<text x="445.0" y="104" class="k" text-anchor="middle">10 ms</text>
