<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1164" viewBox="0 0 1200 1164" role="img" aria-labelledby="ttl dsc">
<title id="ttl">The frame waits: c4 and c4b</title>
<desc id="dsc">Top: three live views of spike c4 on a millisecond axis, the SH-4 and the three PVR passes end to end, then waiting to the end of the frame: work 21.7, 27.1 and 19.3 ms, frames 39.9, 49.9 and 39.9 ms. Below: c4b, the mean frame of 39.2 ms split into the three render-done waits, each showing its render time and the wait past it, and a 2.9 ms rest; the eight first frames at 29.9, 39.9 and 42.7 ms; vblanks a frame, 2 in 38 frames and 3 in 22. The cause of the wait is open.</desc>
