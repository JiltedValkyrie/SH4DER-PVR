<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="ttl dsc">
<title id="ttl">The static bake split: static on static baked once, movers through c4 patches</title>
<desc id="dsc">Left: at load, static casters are binned on a 96 by 96 grid and one ray a model vertex and a ground texel gives a byte a vertex and a ground lightmap. Right: what the bake writes, its memory and its per-frame cost. Bottom: movers cast through c4 on ground patches round them; an open question on where the ray starts; the rule from TOWN-055. All host estimates.</desc>
