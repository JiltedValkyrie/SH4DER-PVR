<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="ttl dsc">
<title id="ttl">The bump comparator in texture space</title>
<desc id="dsc">Top: c4 needs bands because its M, the light depth map, changes across a receiver while Q is one value a polygon; in texture space M is the object texture and Q one value for the whole object, so the compare is exact per pixel. Middle: the cyclic bump level curve peaking at M equals Q, with the threshold window. Bottom: recipe R7, a waterline on a height map, and recipe R8, a dissolve with a burning rim. Not built.</desc>
