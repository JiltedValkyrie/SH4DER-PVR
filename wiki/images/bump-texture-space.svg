<circle cx="730" cy="830" r="26" fill="#fbfaf7"/>
<circle cx="815" cy="840" r="23" fill="#fff6d8" stroke="#f0a030" stroke-width="2"/>
<circle cx="815" cy="840" r="18" fill="#fbfaf7"/>
<circle cx="825" cy="730" r="19" fill="#fff6d8" stroke="#f0a030" stroke-width="2"/>
<circle cx="825" cy="730" r="14" fill="#fbfaf7"/>
<text x="870" y="714" class="b">Body: punch-through on the</text>
<text x="870" y="732" class="b">object&#39;s noise alpha x the</text>
<text x="870" y="750" class="b">progress in vertex alpha</text>
<text x="870" y="768" class="b"><tspan class="k m">[MEASURED PVR-064: the</tspan></text>
<text x="870" y="784" class="b"><tspan class="k m">vertex alpha counts]</tspan></text>
<text x="870" y="808" class="b">Rim: the same noise as a</text>
<text x="870" y="826" class="b">bump texture, Q = the noise</text>
<text x="870" y="844" class="b">at the edge, a narrow window;</text>
<text x="870" y="862" class="b">white, drawn after the body.</text>
<text x="650" y="898" class="s">(illustration)</text>
<text x="629" y="912" class="s">The body and the rim use two rules; their edges meet only if the product&#39;s</text>
<text x="629" y="928" class="s">rounding is known <tspan class="k o">[OPEN PVR-064]</tspan>. Noise inside half a turn (128 codes).</text>
</svg>
