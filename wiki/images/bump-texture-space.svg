<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6577"/></marker></defs>
<rect width="1200" height="960" fill="#fbfaf7"/>
<text x="30" y="36" class="t">The bump comparator in texture space: one Q, exact per pixel, no bands</text>
<rect x="30" y="48" width="1140" height="30" rx="4" fill="#fbf1e2" stroke="#a86a00"/>
<text x="42" y="68" class="b"><tspan class="k e">NOT BUILT. ESTIMATE.</tspan> Recipes R7 and R8 of demo/psm/RECIPES_NOTES.md. The mechanism is measured; the recipes have not run.</text>
<text x="30" y="100" class="s">Status: <tspan class="k m">MEASURED</tspan> our console · <tspan class="k f">FACT</tspan> a manual or our code · <tspan class="k e">ESTIMATE</tspan> our arithmetic or model · <tspan class="k o">OPEN</tspan> not known</text>
<rect x="30" y="116" width="555" height="230" rx="6" class="box"/>
<text x="44" y="140" class="h">c4: M is the light&#39;s depth map</text>
<text x="44" y="162" class="b">M changes across a receiver; Q is one value a polygon</text>
<text x="44" y="180" class="b"><tspan class="k m">[MEASURED PVR-045]</tspan>, so each face is cut into bands.</text>
<path d="M60 320 L280 320 L230 200 L110 200 Z" fill="#f1ede4" stroke="#5b6577" stroke-width="1.4"/>
<path d="M70 296 L270 296" stroke="#8a6d3b"/>
<path d="M80 272 L260 272" stroke="#8a6d3b"/>
<path d="M90 248 L250 248" stroke="#8a6d3b"/>
<path d="M100 224 L240 224" stroke="#8a6d3b"/>
<text x="300" y="240" class="b">one Q a band</text>
<text x="300" y="260" class="b">c4 scene: 692 to 2,464</text>
<text x="300" y="278" class="b">band vertices</text>
<text x="300" y="296" class="b"><tspan class="k m">[MEASURED PVR-100]</tspan></text>
<text x="44" y="336" class="s">The cut costs SH-4 time each frame, and the mask pass grows with it.</text>
<rect x="615" y="116" width="555" height="230" rx="6" class="tm"/>
<text x="629" y="140" class="h">Texture space: M is the object&#39;s own texture</text>
<text x="629" y="162" class="b">M: a height, a noise or a mask, in the object&#39;s own u, v,</text>
<text x="629" y="180" class="b">stored as the bump texture&#39;s byte.</text>
<text x="629" y="204" class="b">Q: one value for the whole object (a water level, a</text>
<text x="629" y="222" class="b">dissolve time). Every polygon gets the same Q.</text>
<text x="629" y="250" class="h2">So the compare is exact per pixel <tspan class="k e">[ESTIMATE]</tspan>:</text>
<text x="629" y="272" class="b">· no bands  · no camera depth map  · no screen coordinates</text>
<text x="629" y="300" class="b">We know of no earlier use of the bump unit this way;</text>
<text x="629" y="318" class="s">we have not searched widely.</text>
<text x="30" y="380" class="h">The window: which pixels pass</text>
<path d="M70 400 L70 590 L540 590" class="ar"/>
<rect x="202.7" y="400" width="88.5" height="190" fill="#eef6f0"/>
