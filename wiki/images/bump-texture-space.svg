<path d="M70 415.9 L540 415.9" stroke="#d9534f" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="546" y="419.94760100054737" class="k">threshold</text>
<path d="M246.9 590 L246.9 598" class="ar"/>
<text x="246.9" y="612" class="k" text-anchor="middle">Q</text>
<text x="500" y="612" class="s">M: 0 .. 255</text>
<text x="62" y="410" class="s" text-anchor="end">255</text>
<text x="62" y="590" class="s" text-anchor="end">0</text>
<text x="40" y="495.0" class="s" transform="rotate(-90 40 495.0)" text-anchor="middle">level</text>
<text x="208.7058823529412" y="582" class="k m">passes</text>
<text x="640" y="400" class="b">The bump level peaks where M = Q. Pixels whose level is</text>
<text x="640" y="418" class="b">over the threshold pass: |M − Q| ≤ w. (Q and w here are</text>
<text x="640" y="436" class="b">for the drawing only.)</text>
<text x="640" y="462" class="b">The curve: level ≈ K1 + K3 cos(2π (M − Q) / 256), cyclic,</text>
<text x="640" y="480" class="b">256 codes a turn <tspan class="k m">[MEASURED PVR-045]</tspan>. It is not exactly</text>
<text x="640" y="498" class="b">the cosine: 443 of 40,960 pairs differ at window 32</text>
<text x="640" y="516" class="b"><tspan class="k m">[MEASURED PVR-096]</tspan>. Edges measured on strips of</text>
<text x="640" y="534" class="b">known codes: 99 .. 157 at w 32, thr 38, 2 codes narrower</text>
<text x="640" y="552" class="b">each end <tspan class="k m">[MEASURED PVR-102]</tspan>; Q from them ends the acne</text>
<text x="640" y="570" class="b"><tspan class="k m">[MEASURED PVR-103]</tspan>.</text>
<text x="640" y="586" class="b">The pass: punch-through list, bump texture, nearest,</text>
<text x="640" y="601" class="b">offset colour on (it carries K1, K3 and Q), reference =</text>
<text x="640" y="616" class="b">the threshold. The bump level is the tested alpha:</text>
<text x="640" y="631" class="b">10,200 of 20,480 drawn, the table predicted 10,320 <tspan class="k m">[MEASURED PVR-065]</tspan></text>
<rect x="30" y="650" width="555" height="290" rx="6" class="box"/>
<text x="44" y="674" class="h">R7: waterline, snow line, flood</text>
