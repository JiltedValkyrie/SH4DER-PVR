<text x="335" y="720" class="b">M: the terrain&#39;s height</text>
<text x="335" y="738" class="b">in its own u, v (8 bit)</text>
<text x="335" y="762" class="b">Q: the water level, the</text>
<text x="335" y="780" class="b">same for every polygon</text>
<text x="335" y="804" class="b">White: the foam line, the</text>
<text x="335" y="822" class="b">pixels inside the window</text>
<text x="335" y="846" class="b">Raise Q each frame: the</text>
<text x="335" y="864" class="b">water rises, nothing re-cut</text>
<text x="44" y="912" class="s">Keep heights in 16 .. 239 (the compare wraps). The line is thin on steep ground,</text>
<text x="44" y="928" class="s">wide on flat. The coplanar pass needs the list&#39;s depth mode <tspan class="k o">[OPEN PVR-062]</tspan>.</text>
<rect x="615" y="650" width="555" height="290" rx="6" class="box"/>
<text x="629" y="674" class="h">R8: dissolve with a burning edge</text>
<rect x="650" y="700" width="200" height="180" fill="#6f86a8" stroke="#1d2330"/>
<circle cx="690" cy="740" r="27" fill="#fff6d8" stroke="#f0a030" stroke-width="2"/>
<circle cx="690" cy="740" r="22" fill="#fbfaf7"/>
