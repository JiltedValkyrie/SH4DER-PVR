<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="846" viewBox="0 0 1200 846" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Render-done wait: sleeping against polled</title>
<desc id="dsc">Two bars on a 0 to 42 ms axis with the 100 Hz scheduler ticks marked every 9.983 ms. Top, the sleeping wait: SH-4 work, then the map, mask and screen renders, each followed by a hatched stretch asleep after the render-done interrupt until the next tick, 4.6, 2.9 and 9.9 ms; the frame ends on tick 4 at 39.9 ms. Bottom, the polled wait: the same work and renders end to end, the frame ends at about 22.5 ms, with a dashed outline to 26.5 ms for the one frame in five that is still long. Below: a table of the measured means and what it means: poll the render-done event.</desc>
