<rect x="610" y="518" width="560" height="250" rx="6" class="tm"/>
<text x="624" y="544" class="h">What it means</text>
<text x="624" y="570" class="b">The interrupt is on time; the wake is late. The sleeping wait runs</text>
<text x="624" y="589" class="b">again only on the next 100 Hz tick: up to 10 ms a pass.</text>
<text x="624" y="608" class="b"><tspan font-weight="700">Rule:</tspan> poll the render-done event in our own code. Nothing</text>
<text x="624" y="627" class="b">in KallistiOS is changed <tspan class="k e">[ADVISED, one run]</tspan>.</text>
<text x="624" y="646" class="s">The town still calls the sleeping wait (psm_dc.c:259, 328, 512, 627)</text>
<text x="624" y="665" class="s"><tspan class="k f">[FACT, the code]</tspan>; what it pays there is not timed <tspan class="k e">[ESTIMATE]</tspan>.</text>
<text x="624" y="684" class="s">The cycle counter stops while the CPU sleeps: it counted 3,400 µs of a</text>
<text x="624" y="703" class="s">39,909 µs sleeping frame; polled, it agrees with the ns clock to 2 µs.</text>
<text x="624" y="722" class="s">Q69: the screen list close is 786 µs mean, 4,033 at most; the flip</text>
<text x="624" y="741" class="s">waiting for a vertical blank? <tspan class="k e">[ESTIMATE, not tested]</tspan></text>
<text x="30" y="794" class="s">Scale: 21.5 px a ms. The tick is 9,983 µs, from the sleeping frame of 39,932 µs in every frame after the first (4.00 ticks) <tspan class="k m">[MEASURED]</tspan>; KallistiOS&#39;s</text>
<text x="30" y="810" class="s">scheduler runs at 100 Hz <tspan class="k f">[FACT, PVR-011, the source]</tspan>. Frames 1 .. 8 polled: 22,440 22,506 22,390 24,920 22,471 22,457 22,550 22,464 µs <tspan class="k m">[MEASURED]</tspan>.</text>
