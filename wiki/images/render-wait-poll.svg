<text x="30" y="474" class="s">Where each part sits is <tspan class="k e">[DERIVED]</tspan>: the three SH-4 gaps (2.05, 0.94, 0.13 ms) are the ones that put every sleeping wake on a tick; together 3.1 ms,</text>
<text x="30" y="490" class="s">against 3.0 measured as frame less waits. In this placement the screen render ends about 50 µs after tick 3, so it sleeps until tick 4. Polled row: the same gaps.</text>
