<path d="M330 216 L330 224 L716 224 L716 216" class="ar"/>
<text x="523.0" y="242" class="k f" text-anchor="middle">tag: which line of RAM</text>
<text x="523.0" y="258" class="s" text-anchor="middle">bits 28..14</text>
