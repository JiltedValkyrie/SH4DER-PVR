<rect x="300" y="480" width="60" height="10" fill="#d9534f"/>
<text x="370" y="490" class="k">entry 145</text>
<text x="300" y="596" class="s">512 entries (part)</text>
<path d="M180 440 C 240 440, 250 485, 298 485" class="ar" marker-end="url(#h)"/>
<path d="M180 530 C 240 530, 250 487, 298 487" class="ar" marker-end="url(#h)"/>
<text x="440" y="430" class="b">One entry holds one line. Reading source line i throws</text>
<text x="440" y="449" class="b">out output line i (written back first if dirty); writing</text>
<text x="440" y="468" class="b">output line i throws out source line i. Every access misses.</text>
<text x="440" y="487" class="b">Hit 3.17 cycles a line, read miss 18.41, write miss 41.91</text>
<text x="440" y="506" class="b"><tspan class="k m">[MEASURED SH4-003]</tspan></text>
<text x="440" y="525" class="b">The same at 1 MB, or any multiple of 16 KB. At 8 KB off,</text>
<text x="440" y="544" class="b">line i of each array lands 256 entries apart: both stay.</text>
<text x="30" y="620" class="h">What it cost, the same routine on a clean and a clashing placing</text>
<text x="30" y="658" class="h2">KOS mat_transform, 256 vertices</text>
<text x="30" y="676" class="s">cycles a vertex</text>
<text x="30" y="694" class="b"><tspan class="k m">[MEASURED SH4-020, 021]</tspan></text>
<rect x="330" y="646" width="177" height="18" fill="#7fb08e"/><text x="512.9640548228601" y="660" class="b">13.16  clean</text>
<rect x="330" y="670" width="520" height="18" fill="#d9534f"/><text x="856.0" y="684" class="b">38.67  1 MB apart</text>
<text x="30" y="730" class="h2">shz_dce_pvr_project</text>
<text x="30" y="748" class="s">cycles a vertex</text>
<text x="30" y="766" class="b"><tspan class="k m">[MEASURED SH4-023, 046]</tspan></text>
<rect x="330" y="718" width="83" height="18" fill="#7fb08e"/><text x="419.0037735849057" y="732" class="b">21.15  clean, in cache</text>
<rect x="330" y="742" width="520" height="18" fill="#d9534f"/><text x="856.0" y="756" class="b">132.5  256 KB apart (c4)</text>
<text x="30" y="802" class="h2">memcpy 4 KB in the cache</text>
<text x="30" y="820" class="s">MB/s, higher is better</text>
<text x="30" y="838" class="b"><tspan class="k m">[MEASURED SH4-032]</tspan></text>
<rect x="330" y="790" width="520" height="18" fill="#7fb08e"/><text x="856.0" y="804" class="b">398  8 KB off</text>
<rect x="330" y="814" width="61" height="18" fill="#d9534f"/><text x="396.88442211055275" y="828" class="b">46.6  1 MB off</text>
<text x="30" y="866" class="s">The pvr_project out of the cache is 58.09 <tspan class="k m">[MEASURED SH4-023]</tspan>: c4's 132.5 is worse than no cache at all. Cite 21.15 for the routine, never 132.5.</text>
<text x="880" y="400" class="h">The fix: one pool, chosen offsets</text>
<rect x="880" y="416" width="300" height="190" rx="6" class="tm"/>
<rect x="896" y="434" width="120" height="26" fill="#dbe6f5" stroke="#1f5fa8"/><text x="904" y="452" class="b">source</text>
<rect x="1016" y="434" width="40" height="26" fill="#fff" stroke="#999" stroke-dasharray="3 3"/><text x="1019" y="452" class="s">pad</text>
<rect x="1056" y="434" width="110" height="26" fill="#fbf1e2" stroke="#a86a00"/><text x="1064" y="452" class="b">output</text>
<text x="896" y="482" class="b">Allocate one pool; put the output at</text>
<text x="896" y="500" class="b">an offset whose remainder by 16 KB is</text>
<text x="896" y="518" class="b">8 KB (half the cache).</text>
<text x="896" y="542" class="b">h2's clean placing was exactly this</text>
