<text x="1017.0" y="242" class="k o" text-anchor="middle">byte in line</text>
<text x="1017.0" y="258" class="s" text-anchor="middle">bits 4..0</text>
<text x="250" y="286" class="b">The addresses differ only in the tag: 0x40000 = 256 KB apart <tspan class="k f">[FACT sh-elf-nm; SH4-046]</tspan></text>
<text x="250" y="304" class="b">Index bits equal, so both land in entry 0x091 (145).</text>
<text x="250" y="322" class="s">Index from bits 13..5 holds with the cache's index mode off. The CCR read 00000105 (SH4-010),</text>
<text x="250" y="338" class="s">which we read as off <tspan class="k e">[ESTIMATE: our decode of the bits]</tspan></text>
<text x="30" y="400" class="h">The clash</text>
<rect x="30" y="420" width="150" height="40" fill="#dbe6f5" stroke="#1f5fa8"/><text x="42" y="445" class="b">source line i</text>
<rect x="30" y="510" width="150" height="40" fill="#fbf1e2" stroke="#a86a00"/><text x="42" y="535" class="b">output line i</text>
<rect x="300" y="410" width="60" height="170" fill="#fff" stroke="#5b6577"/>
