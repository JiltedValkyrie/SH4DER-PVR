<text x="30" y="36" class="t">The placing trap: two arrays a multiple of 16 KB apart share every cache entry</text>
<text x="30" y="58" class="s">The SH-4 operand cache is 16 KB, direct-mapped, 32-byte lines: 512 entries, each holding one line <tspan class="k f">[FACT SH-4 manual; SH4-002]</tspan>. Times from one console, 2026-11-25.</text>
<text x="30" y="76" class="s">Status: <tspan class="k m">MEASURED</tspan> our console · <tspan class="k f">FACT</tspan> a manual or our code · <tspan class="k e">ESTIMATE</tspan> our arithmetic or model · <tspan class="k o">OPEN</tspan> not known</text>
<text x="30" y="108" class="h">Which entry a line goes to</text>
