<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="ttl dsc">
<title id="ttl">The placing trap: arrays a multiple of 16 KB apart share cache entries</title>
<desc id="dsc">How the SH-4 operand cache picks an entry from address bits 13 to 5, why two arrays 256 KB or 1 MB apart clash in one entry per line, what it cost on one console, and the fix: one pool with the second array 8 KB off modulo 16 KB.</desc>
