<text x="42" y="68" class="b"><tspan class="k e">MOCKUP, NO DATA.</tspan> A layout for a bench page drawn on the console. Bars, counts and #### are placeholders, not results.</text>
<text x="30" y="100" class="s">Status: <tspan class="k m">MEASURED</tspan> our console · <tspan class="k f">FACT</tspan> a manual or our code · <tspan class="k e">ESTIMATE</tspan> our arithmetic or model · <tspan class="k o">OPEN</tspan> not known</text>
