<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Console result page: waits, frame strip, histogram</title>
<desc id="dsc">A mockup of a 640 x 480 console screen with no data: header, three horizontal bars of waits per pass with values beside, a strip of 60 frame times, a histogram of vblanks a frame with key numbers beside, and a footer with legend slots and a CRC. Numbered notes on the right explain each part and the rules: the 12 x 24 font, the safe margins, 2 px lines.</desc>
