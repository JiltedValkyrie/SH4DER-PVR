<text x="368" y="664" class="s">title-safe, 64 / 48 px in (80 %)</text>
<text x="30" y="684" class="s"><tspan class="k">REPORTED</tspan>: the usual SD overscan margins; every word and digit sits inside title-safe.</text>
<text x="700" y="134" class="h">What each part is for</text>
<circle cx="709" cy="154" r="9" fill="#d9534f"/><text x="709" y="158" text-anchor="middle" style="font-family:Verdana,Arial,sans-serif;font-size:11px;font-weight:700;fill:#fff">1</text>
<text x="726" y="158" class="s">Header: image, page n / N, test number, title.</text>
<text x="726" y="175" class="s">One test a page.</text>
<circle cx="709" cy="197" r="9" fill="#d9534f"/><text x="709" y="201" text-anchor="middle" style="font-family:Verdana,Arial,sans-serif;font-size:11px;font-weight:700;fill:#fff">2</text>
<text x="726" y="201" class="s">Waits a pass on one ms scale, 8 px a ms: the render</text>
<text x="726" y="218" class="s">solid, the wait past it lighter; exact values beside.</text>
<circle cx="709" cy="240" r="9" fill="#d9534f"/><text x="709" y="244" text-anchor="middle" style="font-family:Verdana,Arial,sans-serif;font-size:11px;font-weight:700;fill:#fff">3</text>
<text x="726" y="244" class="s">Frame strip: one bar a frame, 1.5 px a ms, gold lines at</text>
<text x="726" y="261" class="s">16.7 / 33.3 / 50 ms. Steps and outliers show at a glance.</text>
<circle cx="709" cy="283" r="9" fill="#d9534f"/><text x="709" y="287" text-anchor="middle" style="font-family:Verdana,Arial,sans-serif;font-size:11px;font-weight:700;fill:#fff">4</text>
<text x="726" y="287" class="s">Histogram: one bar a bin, its count printed above it;</text>
<text x="726" y="304" class="s">the last bin is 7 or more.</text>
<circle cx="709" cy="326" r="9" fill="#d9534f"/><text x="709" y="330" text-anchor="middle" style="font-family:Verdana,Arial,sans-serif;font-size:11px;font-weight:700;fill:#fff">5</text>
<text x="726" y="330" class="s">Key numbers as text: the photo carries the exact figure,</text>
<text x="726" y="347" class="s">the graph carries the shape.</text>
<circle cx="709" cy="369" r="9" fill="#d9534f"/><text x="709" y="373" text-anchor="middle" style="font-family:Verdana,Arial,sans-serif;font-size:11px;font-weight:700;fill:#fff">6</text>
<text x="726" y="373" class="s">Legend slots (MEASURED green, ESTIMATE amber) and a</text>
<text x="726" y="390" class="s">CRC32 of the page&#39;s numbers: a misread digit is caught</text>
<text x="726" y="407" class="s">when the numbers are typed back in.</text>
<text x="700" y="443" class="h">Rules for every page</text>
<text x="700" y="465" class="s">· Console font 12 x 24 px, as the bench pages draw it now</text>
<text x="710" y="482" class="s">(bfont_draw_str, 24 px rows, bench_h1.c:70) <tspan class="k f">[FACT]</tspan>.</text>
<text x="710" y="499" class="s">Title-safe holds 42 columns x 16 rows.</text>
<text x="700" y="521" class="s">· Today&#39;s pages start at x 20, y 16: outside both safe</text>
<text x="710" y="538" class="s">frames <tspan class="k f">[FACT bench_h1.c:70]</tspan>.</text>
<text x="700" y="560" class="s">· Lines 2 px or wider, solid fills, no 1 px detail: composite</text>
<text x="710" y="577" class="s">and S-video blur them <tspan class="k e">[ESTIMATE]</tspan>.</text>
<text x="700" y="599" class="s">· Every colour also has a word; nothing is read from colour</text>
<text x="710" y="616" class="s">alone.</text>
<text x="700" y="638" class="s">· Drawn into vram_s with filled rects and bfont text</text>
<text x="710" y="655" class="s"><tspan class="k e">[ESTIMATE: a plan, not built]</tspan>. Phone photo at 1.5 m</text>
<text x="710" y="672" class="s">reads every digit? <tspan class="k o">[OPEN: not tried]</tspan></text>
</svg>
