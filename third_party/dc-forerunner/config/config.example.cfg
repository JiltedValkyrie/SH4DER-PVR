# copy to config/config.local (git-ignored); one KEY=value per line, no quotes
# Machine paths live in config/config.local only. Never write them in committed text.

# the port's short name: the ELF is build/<PORT_NAME>.elf, the image dc-<PORT_NAME>-test.cdi
PORT_NAME=<project>
# disc image title and volume ID, as shown on the Dreamcast CD (volume ID: 8 to 12 characters, no spaces)
DC_TITLE=<GAME TITLE>
DC_VOLUME_ID=<VOLUMEID>

# the owner's own copy of the source game (disc image or extracted files); never in this repo
SOURCE_ISO=<your source disc image or game folder>
# folder for the files your source reader takes from the disc (title.png, title.wav); outside this repo
SOURCE_EXTRACT=<folder for files taken from the disc; keep it outside this repo>
# optional: a reader script for your source format, from its own checkout
SOURCE_READER=<reader script, optional>

KOS_BASE=<KallistiOS checkout, built>
KOS_CC_BASE=<sh-elf toolchain root>
MKDCDISC=<mkdcdisc executable>
DC_OUT=<folder for the .cdi images>
MSYS2_ROOT=<MSYS2 root>
